# mapthing in one container, published through a Cloudflare Tunnel (no open ports).
#
#   cp .env.example .env    # then fill it in (see README.md here)
#   mkdir -p data && sudo chown 10001:10001 data
#   docker compose up -d
#
# Admin UI: https://<your hostname>/admin  (and http://127.0.0.1:8080/admin on the box itself).
# Update:   docker compose pull && docker compose up -d
services:
  mapthing:
    image: ghcr.io/jclement/mapthing:${MAPTHING_TAG:-latest}
    container_name: mapthing
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data            # generations, downloads, SQLite (keys, stats, settings)
    ports:
      - "127.0.0.1:8080:8080"   # local access only; the public path is the tunnel
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: mapthing-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [mapthing]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
