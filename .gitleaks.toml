# gitleaks configuration: the default rules, plus the synthetic values the log-redaction tests use.
#
# internal/logs/logs_test.go and internal/server/logs_test.go feed made-up keys, tokens and
# passwords through the redactor to prove they never reach a log. They have to look like
# secrets for that, so the default rules flag them. Only these exact values are allowed
# (matched against the whole detected secret); none of them is, or ever was, a real credential.
# A new fixture that trips a rule needs its value added here.
#
#   docker run --rm -v $PWD:/repo:ro zricethezav/gitleaks:v8.21.2 git /repo --no-banner

[extend]
useDefault = true

[allowlist]
description = "synthetic fixtures of the log redaction tests"
regexTarget = "secret"
regexes = [
  '''^AIzaSyA\-1234567890abcdefghijklmnopqrstuv$''',
  '''^correct\-horse\-battery\-staple\-9$''',
  '''^eyJhIjoiYWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoifQ$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdefghijklmnop$''',
  '''^mt_abcdefghijklmnopqrstuvwxyz234567abcdefghijklmnopqrst$''',
  '''^tok\-123456789$''',
]
