version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck covers this
        - G115 # integer overflow conversions: tile maths is bounded by validation
        - G204 # subprocess with variable: the supervisor runs configured commands by design
        - G304 # file inclusion via variable: paths come from the data dir and validated keys
        - G306 # WriteFile permissions: data files are not secret
        - G301 # MkdirAll 0755: data directories are not secret
        - G302
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
        - name: var-naming
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]

formatters:
  enable:
    - gofmt
