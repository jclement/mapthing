[tools]
go = "1.27"
node = "24"
golangci-lint = "2"
bun = "1.4"

[env]
MAPTHING_DATA = "{{config_root}}/data"
MAPTHING_LISTEN = ":8080"
# ADMIN_USER / ADMIN_PASSWORD for local dev: put them in mise.local.toml (gitignored).

[tasks.setup]
description = "Install Go and web dependencies (idempotent)"
run = [
  "go mod download",
  "cd web && npm ci --no-audit --no-fund",
  "cd assets/styles && npm ci --no-audit --no-fund",
]

[tasks."build:web"]
description = "Build the admin web UI into web/dist (embedded by the Go binary)"
dir = "web"
run = "npm run build"
sources = ["web/src/**/*", "web/index.html", "web/package-lock.json", "web/vite.config.ts"]
outputs = ["web/dist/index.html"]

[tasks.build]
description = "Build the mapthing binary into bin/"
depends = ["build:web"]
run = "CGO_ENABLED=0 go build -trimpath -o bin/mapthing ./cmd/mapthing"

[tasks.dev]
description = "Run mapthing locally on :8080 with ./data (needs ADMIN_USER/ADMIN_PASSWORD; build tools such as planetiler/valhalla only exist in the container: use docker:dev for builds)"
depends = ["build:web"]
run = "go run ./cmd/mapthing"

[tasks."docker:build"]
description = "Build the container image mapthing:dev (heavy: run as `heavy mise run docker:build`)"
run = "docker build -t mapthing:dev -f docker/Dockerfile ."

[tasks."docker:dev"]
description = "Run the container on :8080 with ./data mounted (long-lived: run in its own herdr tab)"
run = "docker run --rm -it --name mapthing-dev -p 8080:8080 -v {{config_root}}/data:/data --env-file .env mapthing:dev"

[tasks.test]
description = "Unit and API tests (Go + web). Non-interactive."
depends = ["build:web"]
run = [
  "go test ./...",
  "cd web && npm test --if-present",
  "cd docker/renderer && bun test",
]

[tasks.smoke]
description = "End-to-end: build Delaware inside the container and exercise tiles/route/elevation (heavy, needs network)"
run = "scripts/smoke.sh"

[tasks.lint]
description = "Vet, lint, format-check and typecheck. Read-only."
depends = ["build:web"]
run = [
  "test -z \"$(gofmt -l cmd internal)\" || (gofmt -l cmd internal; echo 'gofmt needed'; exit 1)",
  "go vet ./...",
  "golangci-lint run ./...",
  "cd web && npm run lint",
  "cd assets/styles && npm run -s check",
]

[tasks.fmt]
description = "Format Go and web code"
run = [
  "gofmt -w cmd internal",
  "cd web && npm run fmt",
]

[tasks.check]
description = "The done-gate: lint + test"
depends = ["lint", "test"]

[tasks.styles]
description = "Regenerate assets/styles/*.json from the themes in assets/styles/src/themes and validate them (mapbox-gl 1.13 + MapLibre specs)"
dir = "assets/styles"
run = "npm run -s build"
